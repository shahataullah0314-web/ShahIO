[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<mcp_monitor.cpp>
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2

; Optional input-only telemetry firmware. Original Blink remains the default.
[env:uno_mcp]
extends = env:uno
build_src_filter = -<*> +<mcp_monitor.cpp>
